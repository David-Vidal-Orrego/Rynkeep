
services:
  # Contenedor PHP-FPM con Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rynkeep_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ${RYNKEEP_STORAGE_PATH:-./almacenamiento}:/data/archivos
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./docker/php/fpm-env.conf:/usr/local/etc/php-fpm.d/zz-env.conf
    environment:
      RYNKEEP_TAMANO_MAXIMO_MB: ${RYNKEEP_TAMANO_MAXIMO_MB:-100}
    networks:
      - rynkeep_network

  # Contenedor que ejecuta las tareas programadas (vaciar la papelera cada dia a las 00:00)
  tareas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rynkeep_tareas
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./src:/var/www/html
      - ${RYNKEEP_STORAGE_PATH:-./almacenamiento}:/data/archivos
    depends_on:
      - app
      - db
    networks:
      - rynkeep_network

  # Contenedor Servidor Web Nginx
  web:
    image: nginx:alpine
    container_name: rynkeep_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template
    environment:
      RYNKEEP_TAMANO_MAXIMO_MB: ${RYNKEEP_TAMANO_MAXIMO_MB:-100}
    depends_on:
      - app
    networks:
      - rynkeep_network

  # Contenedor Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: rynkeep_db
    restart: unless-stopped
    environment:
      environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - rynkeep_network

networks:
  rynkeep_network:
    driver: bridge

volumes:
  db_data:
    driver: local